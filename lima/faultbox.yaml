# Runtime profile for macOS users. Development toolchains are intentionally
# optional: Faultbox executes prebuilt Linux services from any language.
vmType: vz
cpus: 4
memory: 4GiB
disk: 30GiB
images:
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64
mounts:
  - location: "~"
    writable: true
    mountPoint: /host-home
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq docker.io ca-certificates curl iproute2
      systemctl enable --now docker
probes:
  - mode: readiness
    description: Docker daemon
    script: |
      #!/bin/sh
      set -eu
      sudo docker info >/dev/null
