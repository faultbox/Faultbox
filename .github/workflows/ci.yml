name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (unit + integration, excluding testops)
        run: go test $(go list ./... | grep -v '/testops$') -race -count=1

      # Builds poc service binaries to /tmp for the Linux-only poc_*
      # corpus cases. Safe to run even while those cases are still
      # Skip:'d — the build is cheap and keeps the infra warm.
      - name: Build poc binaries for testops
        run: make testops-prep

      - name: Testops goldens
        run: go test ./testops/... -race -count=1 -v

      - name: Cross-compile (linux/arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/faultbox/
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/faultbox-shim/

      # RFC-054 decision record M0.1: gVisor HEAD does not build as a Go module
      # dependency — pkg/tcpip/stack carries two different external test package
      # names in one directory, which fails at import resolution. gVisor is
      # Bazel-built upstream, so their CI never sees it. The dependency is
      # therefore pinned, and this step makes an attempted bump fail loudly here
      # instead of silently breaking the packet gateway.
      - name: Verify pinned gVisor builds on every target
        run: |
          set -e
          for target in darwin/arm64 linux/arm64 linux/amd64; do
            echo "==> netfault on $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build ./internal/netfault/
          done
